name: Update prices.json

on:
  schedule:
    # cron은 UTC 기준입니다(KST = UTC + 9시간).
    #
    # ① 장 마감 후 당일 종가 수집 — KST 평일 18:00 = UTC 평일 09:00.
    #    국내 증시는 15:30에 마감되므로 2시간 반 여유를 두고 정식 종가를 받습니다.
    #    (장중에 수동 실행하면 '그 시각의 체결가'가 담겨 종가와 다를 수 있습니다.)
    - cron: "0 9 * * 1-5"
    #
    # ② 다음 날 아침 예비 실행 — KST 08:30 = UTC 전날 23:30.
    #    UTC 일~목(0-4)이 KST 월~금 아침에 해당합니다. ①이 실패했을 때의 안전망입니다.
    - cron: "30 23 * * 0-4"
  workflow_dispatch: {}   # 필요할 때 Actions 탭에서 수동 실행

permissions:
  contents: write   # prices.json을 커밋·푸시하기 위해 필요

concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    # 국내 전종목(코스피+코스닥, 약 2,500여 개)까지 yfinance로 받다 보니 기존 30분보다
    # 여유가 필요해서 45분으로 늘렸습니다. 무료 한도(개별 job 6시간)에는 여전히 넉넉합니다.
    timeout-minutes: 45

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존 패키지 설치
        run: |
          python -m pip install --upgrade pip
          # ⚠️ 2026-09-22: pykrx가 KRX 로그인 인증을 요구하도록 바뀌어서(계정 없이는
          # 전종목 시세 조회 자체가 막힘) 제거했습니다. 대신 로그인이 필요 없는
          # FinanceDataReader(종목코드 목록)+yfinance(종가) 조합으로 바꿨습니다.
          pip install yfinance finance-datareader requests

      - name: 시세 수집 실행
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
        run: python fetch_prices.py

      - name: prices.json 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ls -l prices.json
          # ⚠️ 2026-09-22 수정: 이전 버전은 `git diff --quiet -- prices.json`으로 변경 여부를
          # 판단했는데, git diff는 "추적 중인 파일"만 봅니다. prices.json은 저장소에 한 번도
          # 커밋된 적 없는 새 파일(untracked)이라 diff가 항상 비어 있었고, 그래서 매번
          # "변경 없음"으로 빠져서 영원히 커밋되지 않았습니다(수집은 성공했는데 결과가
          # 버려짐). 먼저 git add로 스테이징한 뒤 HEAD와 비교하도록 바꿉니다 —
          # 새 파일이든 수정된 파일이든 올바르게 감지됩니다.
          git add prices.json
          if git diff --cached --quiet -- prices.json; then
            echo "prices.json 변경 없음 — 커밋 생략"
          else
            git commit -m "chore: update prices.json ($(date -u +'%Y-%m-%d'))"
            git push
          fi
